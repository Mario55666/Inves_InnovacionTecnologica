<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Líneas de Investigación e Innovación Tecnológica — Diseño & Comunicación (IDC) 2026" />
  <title>Líneas de Investigación e Innovación Tecnológica — IDC 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       IDC CORPORATE DESIGN SYSTEM
       Primary:  #0072b9 (IDC Blue)
       Secondary:#f3a100 (IDC Orange/Gold)
       Dark:     #545452 / #555553
    ============================================= */
    :root {
      --idc-blue:    #0072b9;
      --idc-orange:  #f3a100;
      --idc-dark:    #545452;
      --idc-dark2:   #555553;
      --c-bg:        #f5f7fa;
      --c-surface:   #ffffff;
      --c-surface2:  #eef2f7;
      --c-border:    rgba(0,114,185,0.13);
      --c-text:      #1a1e2e;
      --c-muted:     #7a7e8a;
      --c-accent1:   #0072b9;
      --c-accent2:   #f3a100;
      --c-accent3:   #00a0c6;
      --c-accent4:   #2ecc71;
      --c-trans:     #8e44ad;
      --radius:      14px;
      --radius-sm:   8px;
      --transition:  0.35s cubic-bezier(0.4,0,0.2,1);
      --font-display:'Playfair Display', Georgia, serif;
      --font-body:   'Nunito', system-ui, sans-serif;
      --shadow-card: 0 4px 24px rgba(0,114,185,0.10);
      --shadow-hover: 0 12px 40px rgba(0,114,185,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: var(--font-body);
      font-weight: 400;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
